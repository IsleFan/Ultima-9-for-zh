# Fork-only helper: builds the MSVC Win32 runtime for testing a branch on macOS/Wine.
# Not part of any pull request to upstream.
name: build-win32
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch, tag or commit to build
        required: true
        default: fix/wine-mac-movie-window
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Configure (MSVC Win32)
        run: cmake -S runtime -B build -A Win32
      - name: Build release programs and unit tests
        run: cmake --build build --config Release --target U9ChtRuntime U9ChtFront U9ChtLauncher U9ChtProxy U9ChtMovieSubtitleTests U9ChtFrontCoreTests
      - name: Unit tests
        run: ctest --test-dir build -C Release -R "U9ChtMovieSubtitleTests|U9ChtFrontCoreTests" --output-on-failure
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build/Release/U9ChtRuntime.dll, build/Release/U9Cht.exe, build/Release/U9ChtLauncher.exe, build/Release/U9ChtProxy.dll out/
          git rev-parse HEAD | Out-File out/COMMIT.txt
          $hashes = Get-ChildItem out -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 200
          $hashes | Out-File out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: u9cht-win32
          path: out/
