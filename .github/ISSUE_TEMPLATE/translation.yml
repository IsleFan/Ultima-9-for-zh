name: 翻譯問題
description: 譯文錯誤、不通順、譯名不一致，或顯示有問題
title: "[翻譯] "
body:
  - type: markdown
    attributes:
      value: |
        謝謝幫忙校稿！在遊戲中看到有問題的翻譯時，按 **Ctrl+Shift+T**（可在首頁的「按鍵設定」→「一般」修改），
        中文化會記下畫面上的翻譯。離開遊戲後，首頁會詢問是否建立回報檔，裡面的 `翻譯標記.txt` 列出了你標記的句子。
  - type: textarea
    id: lines
    attributes:
      label: 有問題的翻譯
      description: 貼上 `翻譯標記.txt` 的內容，或直接把回報檔拖進來。每一行開頭的編號（例如 `text.flx:1234`）可以讓我們直接找到那一句。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 問題與建議
      description: 哪裡有問題？建議怎麼翻？如果知道英文原文或劇情背景，也請說明。
    validations:
      required: true
